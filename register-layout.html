<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="./css/reset.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/style.css">
        <title>register-layout</title>
    </head>
    <body>
        <div class="wrapper-register">
            <h1>register-layout</h1>
            <div class="container-register">
                <div class="left">
                    <img class="avt-register" src="https://img.pikbest.com/origin/09/18/56/30DpIkbEsTV6Y.jpg!w700wp" alt="">
                </div>
                <div class="right">
                    <div class="form-register">
                        <h2>Login</h2>
                        <div class="form-group-re">
                            <label for="name" class="form-label-re">Display Name</label>
                            <input class="form-input-re" type="text" id="name" name="name" placeholder="your name..." spellcheck="false">
                        </div>

                        <div class="form-group-re">
                            <label for="email" class="form-label-re">Email</label>
                            <input class="form-input-re" type="email" id="email" name="email" placeholder="your email... " spellcheck="false">
                        </div>

                        <div class="form-group-re">
                            <label for="phone" class="form-label-re">Phone Number</label>
                            <input class="form-input-re" type="tel" id="phone" name="phone" placeholder="your phone.." spellcheck="false">
                        </div>
                        <button class="btn-register">Sign In</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
