<!DOCTYPE html>
<html lang="vi">
    <head>
        <link rel="stylesheet" href="./css/reset.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/style.css">
        <title>product-list</title>

        <div class="wrapper-list">
